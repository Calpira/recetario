<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recetario</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment:  #F5F0E8;
      --parchment2: #E8E1D5;
      --parchment3: #D6CEC0;
      --ink:        #2A2520;
      --ink2:       #5C554C;
      --ink3:       #9B9188;
      --terracotta: #8B4F35;
      --terra-bg:   #F2EAE4;
      --terra-mid:  #A0604A;
      --sage:       #6B7B6A;
      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      color: var(--ink);
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 4rem;
      position: relative;


      background-color: #2A1F18;
      background-image: url('assets/background.png');
      background-size: cover;
      background-position: center;
    }

    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(28,20,14,.55);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    .hero-logo {
      width: 56px; height: 56px;
      border-radius: 12px;
      object-fit: cover;
      margin: 0 auto 1.5rem;
      display: block;
    }
    .hero-logo-placeholder {
      width: 56px; height: 56px;
      border-radius: 12px;
      background: var(--terracotta);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-size: 28px; color: #F5EFE6;
      margin: 0 auto 1.5rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 400;
      color: #F5EFE6;
      line-height: 1.05;
      letter-spacing: -.02em;
      margin-bottom: .6rem;
    }

    .hero-sub {
      font-size: 15px;
      color: rgba(245,240,230,.5);
      letter-spacing: .06em;
      text-transform: lowercase;
      margin-bottom: 3rem;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 2rem;
    }
    .search-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px;
      color: rgba(245,240,230,.4); pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 13px 16px 13px 40px;
      color: #F5EFE6;
      font-family: var(--font-sans); font-size: 15px;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .search-wrap input::placeholder { color: rgba(245,240,230,.35); }
    .search-wrap input:focus {
      border-color: rgba(160,96,74,.7);
      background: rgba(255,255,255,.13);
    }

    .cats-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: rgba(245,240,230,.35);
      margin-bottom: .85rem;
    }

    .cats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 2rem;
    }

    .cat-card {
      background: rgba(20,14,10,.45);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      padding: .75rem .5rem;
      cursor: pointer;
      text-align: center;
      transition: background .15s, border-color .15s, transform .15s;
      text-decoration: none;
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      color: #F5EFE6;
      text-decoration: none;
    }
    .cat-card:hover {
      background: rgba(139,79,53,.3);
      border-color: rgba(160,96,74,.5);
      transform: translateY(-2px);
    }
    .cat-card .icon { font-size: 1.5rem; line-height: 1; }
    .cat-card .name {
    .cat-card .name {
      font-size: 12px;
      color: #F5EFE6;
      line-height: 1.3;
    }
    }

    .btn-all {
      display: inline-block;
      background: var(--terracotta);
      color: #F5EFE6;
      font-family: var(--font-sans);
      font-size: 14px; font-weight: 500;
      padding: 11px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background .15s, transform .15s;
      border: none; cursor: pointer;
    }
    .btn-all:hover {
      background: var(--terra-mid);
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      .cats-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">


    <img src="assets/logo.png" alt="logo" class="hero-logo"
         onerror="this.outerHTML='<div class=\'hero-logo-placeholder\'>R</div>'" />

    <h1 class="hero-title">Recetario</h1>
    <p class="hero-sub">═════. ❀~✿ .═</p>


    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="buscador" placeholder="Buscar una receta…"
             onkeydown="buscar(event)" autocomplete="off" />
    </div>


    <p class="cats-label">O explorá por categoría</p>
    <div class="cats-grid" id="cats-grid"></div>


    <a href="recetas.html" class="btn-all">Ver todas las recetas</a>

  </div>
</section>

<script>
  const CAT_ICONS = {
    'Panes y masas':      '🍞',
    'Postres':            '🍮',
    'Cafetería':          '☕',
    'Pastelería':         '🥐',
    'Tragos y bebidas':   '🍹',
    'Sopas y caldos':     '🍲',
    'Pastas':             '🍝',
    'Salsas y aderezos':  '🥣',
    'Snacks y aperitivos':'🍟',
    'Platos principales': '🥘',
    'Tartas y quiches':   '🥧',
    'Entradas':           '🧆',
    'Ensaladas':          '🥗',
    'Desayunos':          '🍳',
    'Guarniciones':       '🍚',
    'Ingredientes':       '🧂',
    'Otros':              '✔',
  };

  function catIcon(cat) { return CAT_ICONS[cat] || '🍴'; }

  async function cargarCategorias() {
    try {
      const resp = await fetch('recetas.json');
      const recetas = await resp.json();
      const cats = [...new Set(recetas.map(r => r.categoria))];
      const grid = document.getElementById('cats-grid');
      grid.innerHTML = cats.map(cat => `
        <a class="cat-card" href="recetas.html?cat=${encodeURIComponent(cat)}">
          <span class="name">${cat}</span>
        </a>
      `).join('');
    } catch {
      document.getElementById('cats-grid').style.display = 'none';
    }
  }

  function buscar(e) {
    if (e.key === 'Enter') {
      const q = document.getElementById('buscador').value.trim();
      if (q) window.location.href = `recetas.html?q=${encodeURIComponent(q)}`;
    }
  }

  cargarCategorias();
</script>

</body>
</html>
