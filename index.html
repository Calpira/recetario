<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Recetario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
 
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">R</div>
      <div>
        <p class="logo-title">Mi Recetario</p>
        <p class="logo-sub">cocina de casa</p>
      </div>
    </div>
 
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="buscador" placeholder="Buscar por nombre o ingrediente…" autocomplete="off" />
      <button class="search-clear" id="search-clear" onclick="limpiarBusqueda()" aria-label="Limpiar">×</button>
    </div>
 
    <nav class="cat-nav" id="cat-nav">
      <p class="nav-label">Categorías</p>
    </nav>
 
    <div class="sidebar-footer">
      <a href="recetas.json" target="_blank" class="edit-link">✎</a>
    </div>
  </div>
 
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
  <div class="overlay-bg" id="overlay-bg" onclick="toggleSidebar()"></div>
 
  <!-- MAIN -->
  <main class="main">
    <header class="page-header">
      <div class="header-top">
        <h1 class="page-title" id="page-title">Todas las recetas</h1>
        <p class="page-count" id="conteo"></p>
      </div>
 
      <!-- FILTER BAR -->

    </header>
 
    <div class="grid" id="grid"></div>
  </main>
 
  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="cerrarModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
 
  <script src="js/app.js"></script>
</body>
</html>
